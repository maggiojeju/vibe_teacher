<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바이브코딩으로 수업 도구 만들기 · 조천초 교원 연수</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --ink:#14233A; --paper:#F7F5EF; --paper2:#ECE7DA; --card:#FFFDF8; --line:#D6D0C2;
  --accent:#B84E1E; --accent-soft:#F6E3D6; --teal:#1F6F7F; --teal-soft:#DCEDEF; --warm:#F2B66D;
  --muted:#4A5568; --ok:#1E7A46; --ok-soft:#DFF1E6; --bad:#B42318; --bad-soft:#FBE4E1;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--paper);color:var(--ink);font-size:17px;line-height:1.6}
a{color:var(--teal);font-weight:700;word-break:break-all}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}

/* 상단 바 */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--paper);display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.top .brand{font-weight:900;letter-spacing:.5px}
.top .meta{display:flex;gap:10px;align-items:center;margin-left:auto;flex-wrap:wrap;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;background:#24385A;color:#E6ECF4;font-size:14px;white-space:nowrap}
.chip.host{background:var(--accent);color:#fff}
.chip.demo{background:var(--warm);color:var(--ink)}
.progress{height:4px;background:#24385A;width:100%;position:absolute;left:0;bottom:0}
.progress i{display:block;height:100%;background:var(--warm);transition:width .3s}

/* 본문 */
main{max-width:1080px;margin:0 auto;padding:28px 20px 140px}
.sec{display:inline-block;font-size:14px;font-weight:700;color:var(--accent);letter-spacing:1px;margin-bottom:6px}
h1{font-size:clamp(26px,3.4vw,38px);line-height:1.3;margin:0 0 18px;font-weight:900}
h2{font-size:22px;margin:28px 0 12px}
h3{font-size:18px;margin:0 0 6px}
.lead{font-size:clamp(18px,2vw,22px);font-weight:500}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px 20px}
.card.dark{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.card.dark .muted{color:#C9D3DE}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--teal);color:#fff;margin-bottom:8px}
.pill.o{background:var(--accent)} .pill.g{background:#5B6573}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:10px}
.steps li{counter-increment:s;position:relative;padding-left:44px;min-height:32px}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center}
.big-q{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.big-q .card{flex:1;min-width:240px;font-size:20px}
.arrow{font-size:32px;color:var(--accent);font-weight:900}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;font-size:15px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--paper2)}
.tablewrap{overflow-x:auto}

/* 프롬프트 상자 */
.prompt{position:relative;background:var(--ink);color:#F7F5EF;border-radius:14px;padding:16px 20px 16px;margin:14px 0}
.prompt .plabel{padding-right:70px;font-size:13px;font-weight:700;color:var(--warm);margin-bottom:4px}
.prompt p{margin:0;white-space:pre-wrap}
.copy{position:absolute;top:10px;right:10px;border:0;border-radius:8px;padding:4px 12px;background:var(--warm);color:var(--ink);font-weight:700;font-size:14px}

/* 활동 */
.activity{margin-top:26px;border-top:2px dashed var(--line);padding-top:20px}
.activity-title{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.activity-title b{font-size:19px}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label{font-weight:700;font-size:15px}
.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field textarea:focus{outline:3px solid var(--teal-soft);border-color:var(--teal)}
.btn{border:0;border-radius:10px;padding:10px 20px;font-weight:700;background:var(--accent);color:#fff}
.btn.sec{background:var(--paper2);color:var(--ink)}
.btn.teal{background:var(--teal)}
.btn:disabled{opacity:.5;cursor:default}
.saved{color:var(--ok);font-weight:700;margin-left:10px}
.results{margin-top:22px}
.answers{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.ans{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px}
.ans .who{font-size:13px;font-weight:700;color:var(--teal);margin-bottom:2px}
.ans p{margin:0;white-space:pre-wrap;word-break:break-word}
.count{font-size:14px;color:var(--muted);font-weight:500}

/* 퀴즈 */
.qitem{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.qitem .qtext{font-weight:700;font-size:18px;margin-bottom:10px}
.opts{display:grid;gap:8px}
.opt{position:relative;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;overflow:hidden}
.opt .bar{position:absolute;left:0;top:0;bottom:0;background:var(--teal-soft);z-index:0;transition:width .4s}
.opt span{position:relative;z-index:1}
.opt .pct{float:right;font-weight:700;color:var(--muted)}
.opt:disabled{color:var(--ink);opacity:1;cursor:default}
.opt.mine{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal) inset}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .bar{background:#BFE3CC}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.exp{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--ok-soft);font-size:15px}
.waiting{font-size:14px;color:var(--muted);margin-top:8px}

/* 갤러리 */
.gal{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.gcard{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.gcard .top2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gcard .owner{font-weight:900}
.gcard details{font-size:14px;color:var(--muted)}
.gcard details p{white-space:pre-wrap;margin:6px 0 0;color:var(--ink)}
.like{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px;font-weight:700}
.like.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.cmts{font-size:14px;display:grid;gap:4px;max-height:160px;overflow:auto}
.cmts div{background:var(--paper);border-radius:8px;padding:4px 8px}
.cmtform{display:flex;gap:6px}
.cmtform input{flex:1;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px}
.cmtform button{white-space:nowrap;border:0;border-radius:8px;background:var(--teal);color:#fff;padding:6px 12px;font-size:14px;font-weight:700}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 14px;font-weight:700;font-size:14px}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.stars{display:flex;gap:6px}
.star{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 14px;font-weight:700}
.star.on{background:var(--warm);border-color:var(--warm)}

/* 하단 바 */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1.5px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;box-shadow:0 -6px 20px rgba(20,35,58,.08)}
.bar select{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;max-width:340px;background:#fff}
.bar .stat{font-size:14px;color:var(--muted)}
.notice{background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:18px}

/* 입장 화면 */
.join{max-width:520px;margin:8vh auto;padding:0 20px}
.join .card{padding:28px}
.join h1{font-size:30px}

/* 모달 */
.modal{position:fixed;inset:0;background:rgba(20,35,58,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal .card{max-width:560px;width:100%;text-align:center}
.modal img{width:240px;height:240px;margin:12px auto;display:block;background:#fff}
.urlbox{font-size:20px;font-weight:900;word-break:break-all;background:var(--paper);border-radius:10px;padding:10px;margin:8px 0}

@media (max-width:640px){
  main{padding:20px 14px 170px}
  .top{padding:8px 12px}
  .bar select{max-width:100%;flex:1 1 100%}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   1) 설정 — 연수 전에 이 부분만 바꾸면 됩니다
   ---------------------------------------------------------
   - FIREBASE_CONFIG: Firebase 콘솔 > 프로젝트 설정 > 내 앱(웹)의 설정값
     (Realtime Database를 만들고 databaseURL이 꼭 들어 있어야 합니다)
   - 비워 두면 '데모 모드'로 동작합니다: 같은 브라우저의 탭끼리만 연결됩니다.
   - 강사 화면 주소:   index.html?host=HOST_KEY값
   - 참가자 주소:      index.html
   - 다른 회차로 쓰려면 주소 뒤에 ?s=회차이름 을 붙이면 데이터가 분리됩니다.
   ========================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAbOuvA3yLWAW9UlL8ABpeoCar-db4kuNQ",
  authDomain: "vibecoding-teacher.firebaseapp.com",
  databaseURL: "https://vibecoding-teacher-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "vibecoding-teacher",
  storageBucket: "vibecoding-teacher.firebasestorage.app",
  messagingSenderId: "988118122155",
  appId: "1:988118122155:web:f383304c8bbe430fd2c1ee"
};
const HOST_KEY = "maggio2026";
const DEFAULT_SESSION = "jocheon-1125";

/* =========================================================
   2) 데이터 연결 (Firebase 또는 데모용 로컬 저장)
   ========================================================= */
const params = new URLSearchParams(location.search);
const SESSION = (params.get('s') || DEFAULT_SESSION).replace(/[^\w-]/g, '');
const IS_HOST = params.get('host') === HOST_KEY;
const ROOT = 'sessions/' + SESSION;

function clone(v){ return v === undefined ? null : JSON.parse(JSON.stringify(v)); }

function makeFirebaseDB(){
  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.database();
  return {
    mode: 'firebase',
    on(path, cb){ const r = db.ref(path); const h = s => cb(s.val()); r.on('value', h); return () => r.off('value', h); },
    set(path, v){ return db.ref(path).set(v); },
    update(path, obj){ return db.ref(path).update(obj); },
    push(path, v){ return db.ref(path).push(v); }
  };
}

function makeLocalDB(){
  const KEY = 'vibe-demo-db';
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } };
  let tree = read();
  const subs = [];
  const getAt = p => p.split('/').reduce((o,k) => (o == null ? undefined : o[k]), tree);
  function setAt(p, v){
    const ks = p.split('/'); let o = tree;
    for (let i = 0; i < ks.length - 1; i++){
      if (typeof o[ks[i]] !== 'object' || o[ks[i]] === null) o[ks[i]] = {};
      o = o[ks[i]];
    }
    const last = ks[ks.length - 1];
    if (v === null || v === undefined) delete o[last]; else o[last] = clone(v);
  }
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(tree)); } catch(e){} };
  const notify = () => subs.forEach(s => s.cb(clone(getAt(s.path))));
  window.addEventListener('storage', e => { if (e.key === KEY){ tree = read(); notify(); } });
  return {
    mode: 'demo',
    on(path, cb){ const s = {path, cb}; subs.push(s); cb(clone(getAt(path))); return () => subs.splice(subs.indexOf(s), 1); },
    set(path, v){ setAt(path, v); persist(); notify(); return Promise.resolve(); },
    update(path, obj){ Object.keys(obj).forEach(k => setAt(path + '/' + k, obj[k])); persist(); notify(); return Promise.resolve(); },
    push(path, v){ return this.set(path + '/k' + Date.now().toString(36) + Math.random().toString(36).slice(2,6), v); }
  };
}

const USE_FIREBASE = !!(FIREBASE_CONFIG.databaseURL && window.firebase);
const DB = USE_FIREBASE ? makeFirebaseDB() : makeLocalDB();

// 참가자 식별: 실제 운영에서는 브라우저에 저장, 데모에서는 탭마다 다른 사람으로
function store(){ try { return DB.mode === 'demo' ? sessionStorage : localStorage; } catch(e){ return null; } }
function sget(k){ try { return store().getItem(k); } catch(e){ return null; } }
function sset(k, v){ try { store().setItem(k, v); } catch(e){} }
const UID = IS_HOST ? 'host' : (sget('vibe-uid-' + SESSION) || (() => {
  const id = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  sset('vibe-uid-' + SESSION, id); return id;
})());
let myName = IS_HOST ? '강사' : (sget('vibe-name-' + SESSION) || '');

/* =========================================================
   3) 화면 도우미
   ========================================================= */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const linkify = s => esc(s).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
const safeUrl = u => /^https?:\/\/\S+$/i.test(String(u || '').trim()) ? String(u).trim() : '';
let promptSeq = 0;
function promptBox(label, text){
  const id = 'pr' + (promptSeq++);
  return `<div class="prompt"><button class="copy" data-copy="${id}">복사</button><div class="plabel">${esc(label)}</div><p id="${id}">${esc(text)}</p></div>`;
}
const link = (url, text) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${text}</a>`;

/* =========================================================
   4) 연수 단계 (슬라이드 흐름과 같은 순서)
   ========================================================= */
const PROMPT_COLOR = '초등학교 5학년 미술 ‘디지털 드로잉의 색 혼합’ 수업용 웹페이지를 만들어 줘. 빨강·초록·파랑 슬라이더를 움직이면 섞인 색이 큰 원에 바로 보이고, 그 색의 색상 코드(예: #FF8800)도 함께 표시해 줘. “하늘색을 만들어 보세요” 같은 색 만들기 미션 3개도 넣어 줘. 화면은 한국어로, 슬라이더와 버튼은 크게.';
const PROMPT_COMPARE = '1부터 28까지 번호 중에서 발표자를 한 명 뽑아 주는 웹페이지를 만들어 줘. 버튼은 크게.';
const PROMPT_DASH = '초등 교사용 ‘나만의 수업 대시보드’ 웹페이지를 만들어 줘. 한 화면에 ① 시작·정지되는 수업 타이머 ② 1~28번 중 발표자 뽑기 ③ 자주 쓰는 사이트 링크 버튼 6개(이름과 주소는 내가 쉽게 바꿀 수 있게) ④ 입력한 주소로 QR 코드 만들기를 카드 모양으로 배치해 줘. 글씨는 크게, 한국어로.';
const PROMPT_CLUB = '구글 Apps Script로 ‘동아리 신청서’ 웹앱을 만들어 줘. 학년, 반, 번호, 이름, 1지망·2지망 동아리(목록에서 선택: 코딩, 드론, 독서, 축구, 미술), 신청 이유를 입력하면 이 스프레드시트의 ‘신청’ 시트에 제출 시각과 함께 한 줄씩 저장되게 해 줘. Code.gs와 index.html로 나눠 주고, 저장되면 ‘신청 완료’를 보여 줘. 붙여넣기와 배포 방법도 단계별로 알려 줘.';
const PROMPT_KAHOOT = '5학년 과학 ‘태양계’ 객관식 10문항을 문제, 보기 4개, 정답 형식으로 정리해 줘.';

const STEPS = [
  { id:'welcome', sec:'열기', title:'환영합니다! 바이브코딩으로 수업 도구 만들기',
    body:`<p class="lead">오늘 이 페이지는 <b>강사 화면과 함께 넘어갑니다.</b> 화면이 바뀌면 그 단계의 활동을 해 주세요.</p>
    <div class="grid g3" style="margin-top:16px">
      <div class="card"><span class="pill">이해</span><h3>바이브코딩이란?</h3><p class="muted small">정의, 등장 배경, 쓸까 만들까</p></div>
      <div class="card"><span class="pill o">실습 3개</span><h3>직접 만들기</h3><p class="muted small">대시보드 · 동아리 신청서 · 고정 주소 배포</p></div>
      <div class="card"><span class="pill g">나눔</span><h3>함께 보기</h3><p class="muted small">퀴즈, 아이디어, 결과물 갤러리</p></div>
    </div>
    <p class="muted small" style="margin-top:16px">준비물: 크롬 브라우저, 학교 구글 계정(로그인), GitHub 계정</p>` },

  { id:'ice', sec:'열기 · 아이스브레이킹', title:'선생님의 경험을 들려주세요',
    body:`<p class="muted">짧게 써도 괜찮아요. 없으면 “없음”이라고 적어 주세요.</p><p class="lead" style="margin-top:8px">🙈 이 활동은 <b>이름 없이</b> 공개됩니다. 누가 썼는지 강사도 알 수 없어요.</p>`,
    act:{ type:'survey', title:'경험 나누기', anon:true, qs:[
      {id:'made', label:'Q1. 직접 만들어 본 프로그램이나 웹앱이 있나요?', ph:'예: 구글 설문으로 만든 독서 기록장'},

  app.innerHTML = `

  const n = Object.keys(people()).length;
  const pc = document.getElementById('peopleChip'); if (pc) pc.textContent = `참여 ${n}명`;
  const sc = document.getElementById('stepChip'); if (sc) sc.textContent = `${viewStep + 1} / ${STEPS.length}`;
  const pg = document.getElementById('prog'); if (pg) pg.style.width = ((hostStep() + 1) / STEPS.length * 100) + '%';
}

function onData(){
  if (!started) return;
  updateHeader();
  if ((IS_HOST || follow) && viewStep !== hostStep()){
    viewStep = hostStep(); renderStep();
  } else {
    renderResults();
  }
  renderBar();
}

function renderStep(){
  const st = STEPS[viewStep];
  promptSeq = 0;
  const main = document.getElementById('main');
  main.innerHTML = `
    ${IS_HOST && DB.mode === 'demo' ? `<div class="notice">데모 모드입니다. 같은 브라우저에서 새 탭으로 <b>참가자 주소</b>를 열면 동기화를 시험할 수 있어요. 실제 연수 전에는 코드 맨 위 FIREBASE_CONFIG를 채워 주세요.</div>` : ''}

  main.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copyText(document.getElementById(b.dataset.copy).textContent, b));
  const bl = document.getElementById('backLive'); if (bl) bl.onclick = () => { follow = true; viewStep = hostStep(); renderStep(); renderBar(); };
  renderForm();
  renderResults();
  updateHeader();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function copyText(t, btn){
  const done = () => { const o = btn.textContent; btn.textContent = '복사됨 ✓'; setTimeout(() => btn.textContent = o, 1500); };
  if (navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(t).then(done, () => fallback()); } else fallback();
  function fallback(){
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e){}
    ta.remove();
  }
}

      ${a.qs.map(q => `<div class="field"><label for="f_${q.id}">${esc(q.label)}</label>${
        q.kind === 'long' || (a.type === 'survey')
          ? `<textarea id="f_${q.id}" placeholder="${esc(q.ph || '')}" maxlength="2000">${esc(mine[q.id] || '')}</textarea>`
          : `<input id="f_${q.id}" type="${q.kind === 'url' ? 'url' : 'text'}" placeholder="${esc(q.ph || '')}" value="${esc(mine[q.id] || '')}" maxlength="500">`
      }</div>`).join('')}
      <button class="btn" type="submit">${mine.t ? '다시 보내기' : '보내기'}</button><span class="saved" id="savedMsg">${mine.t ? '보냄 ✓' : ''}</span>
    </form>`;
    document.getElementById('actForm').onsubmit = e => {
      e.preventDefault();
      const v = a.anon ? { t: Date.now() } : { name: myName, t: Date.now() };
      let any = false;
      a.qs.forEach(q => { const val = document.getElementById('f_' + q.id).value.trim(); v[q.id] = val; if (val) any = true; });
      if (!any) return;
      const urlQ = a.qs.find(q => q.kind === 'url');
      if (urlQ && v[urlQ.id] && !safeUrl(v[urlQ.id])){ alertMsg('링크는 https:// 로 시작하는 주소를 붙여 넣어 주세요.'); return; }
      DB.set(`${ROOT}/resp/${st.id}/${UID}`, v).then(() => {
        const m = document.getElementById('savedMsg'); if (m) m.textContent = '보냄 ✓';
        const b = e.target.querySelector('button'); if (b) b.textContent = '다시 보내기';
      });
    };
  } else if (a.type === 'feedback'){
    if (IS_HOST){ box.innerHTML = `<p class="muted small">참가자 화면에는 만족도와 소감 입력 칸이 보입니다.</p>`; return; }
    let rating = mine.rating || 0;
    box.innerHTML = `<form id="fbForm">
      <div class="field"><label>오늘 연수는 어떠셨나요?</label><div class="stars" id="stars">${[1,2,3,4,5].map(n => `<button type="button" class="star${rating >= n ? ' on' : ''}" data-n="${n}">${n}</button>`).join('')}</div></div>
      <div class="field"><label for="f_use">내 수업(업무)에서 가장 먼저 만들어 보고 싶은 것은?</label><textarea id="f_use" maxlength="1000">${esc(mine.use || '')}</textarea></div>
      <div class="field"><label for="f_say">한 줄 소감</label><input id="f_say" maxlength="300" value="${esc(mine.say || '')}"></div>
      <button class="btn" type="submit">${mine.t ? '다시 보내기' : '보내기'}</button><span class="saved" id="savedMsg">${mine.t ? '보냄 ✓' : ''}</span>
    </form>`;
    box.querySelectorAll('.star').forEach(b => b.onclick = () => {
      rating = +b.dataset.n; box.querySelectorAll('.star').forEach(x => x.classList.toggle('on', +x.dataset.n <= rating));
    });
    document.getElementById('fbForm').onsubmit = e => {
      e.preventDefault();
      if (!rating){ alertMsg('만족도(1~5)를 골라 주세요.'); return; }
      DB.set(`${ROOT}/resp/${st.id}/${UID}`, { name: myName, t: Date.now(), rating, use: document.getElementById('f_use').value.trim(), say: document.getElementById('f_say').value.trim() })
        .then(() => { const m = document.getElementById('savedMsg'); if (m) m.textContent = '보냄 ✓'; });
    };
  } else {
    box.innerHTML = '';
  }
}

function alertMsg(t){
  const r = document.getElementById('modalRoot');
  r.innerHTML = `<div class="modal"><div class="card"><p class="lead">${esc(t)}</p><button class="btn" id="mOk">확인</button></div></div>`;
  document.getElementById('mOk').onclick = () => r.innerHTML = '';
}

/* ---------- 결과 ---------- */
function sortByTime(obj){ return Object.entries(obj).sort((a,b) => (b[1].t || 0) - (a[1].t || 0)); }

function keepInputs(container, fn){
  // 다시 그려도 입력 중이던 댓글이 지워지지 않게
  const kept = {}; let focusId = null, selStart = null;
  container.querySelectorAll('input[data-keep]').forEach(i => { kept[i.dataset.keep] = i.value; if (document.activeElement === i){ focusId = i.dataset.keep; selStart = i.selectionStart; } });
  fn();
  container.querySelectorAll('input[data-keep]').forEach(i => { if (kept[i.dataset.keep] !== undefined) i.value = kept[i.dataset.keep]; if (i.dataset.keep === focusId){ i.focus(); try { i.setSelectionRange(selStart, selStart); } catch(e){} } });
}

function renderResults(){
  const st = STEPS[viewStep]; const a = st.act; const box = document.getElementById('res');
  if (!a || !box) return;
  const r = resp(st.id); const n = Object.keys(r).length;
  if (a.type === 'survey'){
    box.innerHTML = a.qs.map(q => {
      const list = sortByTime(r).filter(([,v]) => v[q.id]);
      return `<h2 style="font-size:18px">${esc(q.label)} <span class="count">${list.length}개</span></h2>
        <div class="answers">${list.map(([,v]) => `<div class="ans">${a.anon ? '' : `<div class="who">${esc(v.name)}</div>`}<p>${linkify(v[q.id])}</p></div>`).join('') || '<p class="muted small">아직 응답이 없어요.</p>'}</div>`;
    }).join('');
  } else if (a.type === 'ideas'){
    const list = sortByTime(r);
    box.innerHTML = `<h2 style="font-size:18px">모두의 아이디어 <span class="count">${list.length}개</span></h2>
      <div class="answers">${list.map(([,v]) => `<div class="ans"><div class="who">${esc(v.name)}</div>${a.qs.map(q => v[q.id] ? `<p><b>${esc(q.label)}</b> ${esc(v[q.id])}</p>` : '').join('')}</div>`).join('') || '<p class="muted small">첫 아이디어를 올려 주세요!</p>'}</div>`;
  } else if (a.type === 'submit'){
    keepInputs(box, () => {
      box.innerHTML = `<h2 style="font-size:18px">제출된 결과물 <span class="count">${n}개</span></h2>` + galleryCards([st.id]);
      wireGallery(box);
    });
  } else if (a.type === 'gallery'){
    keepInputs(box, () => {
      const labels = { p1: '실습 1 · 대시보드', p2: '실습 2 · 신청서', p3: '실습 3 · 고정 주소' };
      const from = galleryFilter === 'all' ? a.from : [galleryFilter];
      box.innerHTML = `<div class="tabs">${['all', ...a.from].map(k => `<button class="tab${galleryFilter === k ? ' on' : ''}" data-tab="${k}">${k === 'all' ? '전체' : labels[k]}</button>`).join('')}</div>` + galleryCards(from, labels);
      box.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { galleryFilter = b.dataset.tab; renderResults(); });
      wireGallery(box);
    });
  } else if (a.type === 'quiz'){
    renderQuiz(st, box);
  } else if (a.type === 'feedback'){
    const list = sortByTime(r);
    const avg = list.length ? (list.reduce((s,[,v]) => s + (+v.rating || 0), 0) / list.length).toFixed(1) : '-';
    box.innerHTML = `${IS_HOST ? `<div class="card dark" style="margin-bottom:14px"><b>평균 만족도 ${avg} / 5</b> · 응답 ${list.length}명</div>` : ''}
      <h2 style="font-size:18px">모두의 소감 <span class="count">${list.length}개</span></h2>
      <div class="answers">${list.map(([,v]) => `<div class="ans"><div class="who">${esc(v.name)}</div>${v.say ? `<p>${esc(v.say)}</p>` : ''}${v.use ? `<p class="muted small" style="margin-top:6px">만들어 볼 것: ${esc(v.use)}</p>` : ''}</div>`).join('') || '<p class="muted small">아직 소감이 없어요.</p>'}</div>`;
  }
}

function galleryCards(stepIds, labels){
  const likes = data.likes || {}; const cmts = data.cmt || {};
  const items = [];
  stepIds.forEach(sid => Object.entries(resp(sid)).forEach(([uid, v]) => items.push({ sid, uid, v })));
  items.sort((a,b) => (b.v.t || 0) - (a.v.t || 0));
  if (!items.length) return '<p class="muted small">아직 제출된 결과물이 없어요.</p>';
  return `<div class="gal">${items.map(({sid, uid, v}) => {
    const key = sid + '__' + uid;
    const lk = likes[key] || {}; const ln = Object.keys(lk).length; const on = !!lk[UID];
    const cl = Object.values(cmts[key] || {}).sort((a,b) => (a.t || 0) - (b.t || 0));
    const url = safeUrl(v.url);
    return `<div class="gcard">
      <div class="top2"><span class="owner">${esc(v.name)}</span>${labels ? `<span class="pill g" style="margin:0">${esc(labels[sid] || '')}</span>` : ''}</div>
      ${v.desc ? `<div>${esc(v.desc)}</div>` : ''}
      ${url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">결과물 열기 ↗</a>` : ''}
      ${v.prompt ? `<details><summary>프롬프트 보기</summary><p>${esc(v.prompt)}</p></details>` : ''}
      <div><button class="like${on ? ' on' : ''}" data-like="${esc(key)}">❤ ${ln}</button></div>
      ${cl.length ? `<div class="cmts">${cl.map(c => `<div><b>${esc(c.name)}</b> ${esc(c.text)}</div>`).join('')}</div>` : ''}
      <form class="cmtform" data-cmt="${esc(key)}"><input data-keep="c_${esc(key)}" maxlength="200" placeholder="한 줄 피드백"><button type="submit">남기기</button></form>
    </div>`;
  }).join('')}</div>`;
}

function wireGallery(box){
  box.querySelectorAll('[data-like]').forEach(b => b.onclick = () => {
    const key = b.dataset.like; const on = !!(((data.likes || {})[key] || {})[UID]);
    DB.set(`${ROOT}/likes/${key}/${UID}`, on ? null : true);
  });
  box.querySelectorAll('[data-cmt]').forEach(f => f.onsubmit = e => {
    e.preventDefault();
    const inp = f.querySelector('input'); const text = inp.value.trim(); if (!text) return;
    inp.value = '';
    DB.push(`${ROOT}/cmt/${f.dataset.cmt}`, { name: myName, text: text.slice(0, 200), t: Date.now() });
  });
}

function renderQuiz(st, box){
  const a = st.act; const r = resp(st.id); const mine = (r[UID] || {}).a || {}; const rev = revealed(st.id);
  const showStats = IS_HOST || rev;
  box.innerHTML = a.items.map((it, qi) => {
    const counts = it.opts.map(() => 0); let total = 0;
    Object.values(r).forEach(v => { const x = (v.a || {})[it.id]; if (x !== undefined && x !== null){ counts[x] = (counts[x] || 0) + 1; total++; } });
    return `<div class="qitem">
      <div class="qtext">${qi + 1}. ${esc(it.q)}</div>
      <div class="opts">${it.opts.map((o, oi) => {
        const pct = total ? Math.round(counts[oi] / total * 100) : 0;
        const cls = ['opt'];
        if (mine[it.id] === oi) cls.push('mine');
        if (rev && oi === it.ans) cls.push('correct');
        if (rev && mine[it.id] === oi && oi !== it.ans) cls.push('wrong');
        return `<button class="${cls.join(' ')}" data-q="${it.id}" data-o="${oi}" ${IS_HOST || rev ? 'disabled' : ''}>
          ${showStats ? `<i class="bar" style="width:${pct}%"></i>` : ''}<span>${esc(o)}${rev && oi === it.ans ? ' ✓' : ''}</span>${showStats ? `<span class="pct">${counts[oi]}명 · ${pct}%</span>` : ''}</button>`;
      }).join('')}</div>
      ${rev ? `<div class="exp">${esc(it.exp)}</div>` : (IS_HOST ? `<div class="waiting">응답 ${total}명</div>` : (mine[it.id] !== undefined ? '<div class="waiting">선택 완료 · 강사가 정답을 공개하면 결과가 보여요</div>' : ''))}
    </div>`;
  }).join('');
  if (!IS_HOST && !rev){
    box.querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
      DB.update(`${ROOT}/resp/${st.id}/${UID}`, { name: myName, t: Date.now(), ['a/' + b.dataset.q]: +b.dataset.o });
    });
  }
}

/* ---------- 하단 바 ---------- */
function renderBar(){
  const bar = document.getElementById('bar'); if (!bar) return;
  const st = STEPS[viewStep]; const hs = hostStep();
  if (IS_HOST){
    const n = Object.keys(resp(st.id)).length;
    const isQuiz = st.act && st.act.type === 'quiz';
    bar.innerHTML = `
      <button class="btn sec" id="hPrev" ${viewStep === 0 ? 'disabled' : ''}>◀ 이전</button>
      <select id="hSel">${STEPS.map((s,i) => `<option value="${i}" ${i === viewStep ? 'selected' : ''}>${i + 1}. ${esc(s.sec)} · ${esc(s.title)}</option>`).join('')}</select>
      <button class="btn" id="hNext" ${viewStep === STEPS.length - 1 ? 'disabled' : ''}>다음 ▶</button>
      ${isQuiz ? `<button class="btn teal" id="hRev">${revealed(st.id) ? '정답 숨기기' : '정답 공개'}</button>` : ''}
      ${st.act ? `<span class="stat">응답 ${n}명</span>` : ''}
      <button class="btn sec" id="hJoin">참여 주소·QR</button>
      ${st.act && st.act.type !== 'gallery' ? `<button class="btn sec" id="hClear" title="이 단계의 응답을 모두 지웁니다">응답 지우기</button>` : ''}`;
    document.getElementById('hPrev').onclick = () => goHost(viewStep - 1);
    document.getElementById('hNext').onclick = () => goHost(viewStep + 1);
    document.getElementById('hSel').onchange = e => goHost(+e.target.value);
    const rv = document.getElementById('hRev'); if (rv) rv.onclick = () => DB.set(`${ROOT}/state/reveal/${st.id}`, revealed(st.id) ? null : true);
    document.getElementById('hJoin').onclick = showJoinModal;
    const cl = document.getElementById('hClear'); if (cl) cl.onclick = () => {
      if (confirm(`‘${st.title}’ 단계의 응답 ${n}개를 모두 지울까요? 되돌릴 수 없습니다.`)) DB.set(`${ROOT}/resp/${st.id}`, null);
    };
  } else {
    bar.innerHTML = `
      <button class="btn sec" id="pPrev" ${viewStep === 0 ? 'disabled' : ''}>◀ 지난 단계</button>
      <span class="stat">${follow ? '강사 화면을 따라가는 중' : `지난 단계 보는 중 (강사는 ${hs + 1}단계)`}</span>
      <button class="btn sec" id="pNext" ${viewStep >= hs ? 'disabled' : ''}>다음 ▶</button>
      ${!follow ? '<button class="btn teal" id="pLive">강사 화면으로</button>' : ''}`;
    document.getElementById('pPrev').onclick = () => { follow = false; viewStep = Math.max(0, viewStep - 1); renderStep(); renderBar(); };
    document.getElementById('pNext').onclick = () => { viewStep = Math.min(hs, viewStep + 1); follow = viewStep === hs; renderStep(); renderBar(); };
    const lv = document.getElementById('pLive'); if (lv) lv.onclick = () => { follow = true; viewStep = hs; renderStep(); renderBar(); };
  }
}

function goHost(i){
  if (i < 0 || i >= STEPS.length) return;
  viewStep = i; renderStep(); renderBar();
  DB.update(`${ROOT}/state`, { step: i, t: Date.now() });
}

function showJoinModal(){
  let url = location.origin + location.pathname;
  if (SESSION !== DEFAULT_SESSION) url += '?s=' + encodeURIComponent(SESSION);
  const r = document.getElementById('modalRoot');
  const qr = 'https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=8&data=' + encodeURIComponent(url);
  r.innerHTML = `<div class="modal"><div class="card">
    <h2 style="margin-top:0">참여 주소</h2>
    <img src="${qr}" alt="참여 주소 QR 코드">
    <div class="urlbox">${esc(url)}</div>
    <p class="muted small">QR을 찍거나 주소를 입력해 입장합니다.</p>
    <button class="btn" id="mClose">닫기</button>
  </div></div>`;
  document.getElementById('mClose').onclick = () => r.innerHTML = '';
}

/* =========================================================
   6) 시작
   ========================================================= */
DB.on(ROOT, v => { data = v || {}; onData(); });
if (IS_HOST || myName){
  if (!IS_HOST) DB.update(`${ROOT}/people/${UID}`, { name: myName, t: Date.now() });
  start();
} else {
  renderJoin();
}
</script>
</body>
</html>
